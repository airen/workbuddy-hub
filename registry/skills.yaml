skills:
- id: agent-doc-memory
  name: 文档即记忆
  version: 1.0.0
  type: skill
  description: 用「能读、能改、能提交」的 Markdown 文档工作区替代召回式记忆插件，让 agent 干活前先查、干完再更新。当用户抱怨「agent 记不住项目」「每次都要重新解释」「上次说好的又忘了」「同一个坑踩三次」「跨会话记不住」，或要建立
    AGENTS.md / CLAUDE.md / 项目文档 / 知识库 / 长期记忆 / 跨会话记忆 / 团队共享上下文，或提到「记忆插件」「RAG 记忆」「向量库记忆」「Operator Memory」「Agent
    不需要记忆」时使用。也适用于 agent 自己：即将开始一个跨会话的长期项目、要做技术决策、写了规格、搞清楚某个第三方库的用法、澄清了术语、或发现文档与代码不一致时，主动把知识写进文档工作区。产出
    INDEX.md 索引与约定 / 规格 / 决策 / 调研 / 术语五类文档，并可对既有文档工作区做孤儿文档、断链、过期审计。
  category: other
  tags: []
  status: active
  _source: manifest.yaml
  path: skills/agent-doc-memory
- id: ai-project-pilot
  name: AI 项目推进官
  version: 1.0.0
  type: skill
  description: 用「立项 → 计划 → 执行与监控 → 验收与上线」四阶段方法推进 AI 产品与 AI 项目落地，融合 PMP 项目管理与 AI 软件工程实践。当用户要推进或管理一个 AI
    项目／AI 产品、写 AI 项目立项与项目章程、定义业务目标与成功标准、拆 WBS 与里程碑、做资源与风险计划、盯执行与偏差、做上线验收与复盘，或提出「AI 助手怎么做」「大模型应用怎么落地」「AI
    需求怎么定价值」「AI 项目怎么验收」「智能体项目怎么推进」「这个 AI 项目卡住了」「AI 项目推不动」「模型上线后效果变差」这类问题，或要为项目定一份工程规范（CLAUDE.md / AGENTS.md）时使用。产出项目章程、相关方登记册、风险登记册、WBS
    与里程碑、状态报告、变更申请、验收记录、运营交接包、复盘报告、工程规范等可直接使用的文档。
  category: other
  tags: []
  status: active
  _source: manifest.yaml
  path: skills/ai-project-pilot
- id: ask-matt
  name: 技能路由
  version: 1.0.0
  type: skill
  description: 该技能是一个路由器（router），根据你此刻的处境告诉你该用哪个技能、走哪条流程：从想法到交付的主流程、分诊 / 诊断 / 寻路这类入口（on-ramp）、代码库维护，以及运行在底层的词汇技能。适用于「我该用哪个技能」「接下来干嘛」「这个情况走什么流程」「下一步做什么」「ask
    matt」这类需求。
  category: development
  tags: []
  status: active
  _source: manifest.yaml
  path: skills/ask-matt
- id: code-review
  name: 代码评审
  version: 1.0.0
  type: skill
  description: 该技能沿两个轴评审自某个固定点（commit、分支、tag 或 merge-base）以来的改动：标准（Standards，代码是否符合本仓库有文档记录的编码标准？）与规格（Spec，代码是否忠实实现了来源
    issue/spec？）。两个评审作为并行子代理运行并并排汇报。适用于「review 一下这个分支」「帮我审一下这个 PR」「review since X」「看看这些改动有没有问题」这类需求。
  category: development
  tags: []
  status: active
  _source: manifest.yaml
  path: skills/code-review
