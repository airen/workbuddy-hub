id: ui-design-field-manual
name: UI 设计军规
version: 1.0.0
type: skill
description: 用 26 条可工程化的视觉规则，治住 AI 生成界面的「塑料风 / 草台班子感」，让 agent 写出来的页面达到可交付的商业水准。当用户要写或改任何界面、做前端页面、做 Web
  App / 小程序 / 后台 / 落地页 / 表单 / 卡片 / 列表 / 仪表盘 / 定价页 / 空状态，或说「界面太丑」「一股 AI 味」「AI 塑料风」「看着很廉价」「像草台班子」「不够高级」「帮我美化一下
  UI」「排版不好看」「颜色很乱」「间距很挤」「界面很平没有重点」「假数据一眼假」「图标太普通」「一点动效都没有」「这个设计能不能用」「帮我做设计评审」「UI 自检」「设计军规」「Refactoring
  UI」时使用。也适用于 agent 在生成 HTML/CSS/Tailwind/React 界面代码前先定基调与首屏骨架、生成后做交付前视觉自检与独立评审，或为用户建立一套可复用的设计令牌（字号 /
  行高 / 间距 / 色阶）。产出可直接落地的设计令牌、基调卡、自检报告与独立评审意见。
