description: 用「立项 → 计划 → 执行与监控 → 验收与上线」四阶段方法推进 AI 产品与 AI 项目落地，融合 PMP 项目管理与 AI 软件工程实践。当用户要推进或管理一个 AI 项目／AI
  产品、写 AI 项目立项与项目章程、定义业务目标与成功标准、拆 WBS 与里程碑、做资源与风险计划、盯执行与偏差、做上线验收与复盘，或提出「AI 助手怎么做」「大模型应用怎么落地」「AI 需求怎么定价值」「AI
  项目怎么验收」「智能体项目怎么推进」「这个 AI 项目卡住了」「AI 项目推不动」「模型上线后效果变差」这类问题，或要为项目定一份工程规范（CLAUDE.md / AGENTS.md）时使用。产出项目章程、相关方登记册、风险登记册、WBS
  与里程碑、状态报告、变更申请、验收记录、运营交接包、复盘报告、工程规范等可直接使用的文档。
