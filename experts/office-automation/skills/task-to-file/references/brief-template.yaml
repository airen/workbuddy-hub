# 任务简报模板（brief-template）
# 用法：把这份模板复制出来，填好你要的那一项，交给「办妥」即可生成对应文件。
# 一次只主打一种 output_type；要多种文件就分多条 brief。

brief:
  output_type: ppt            # 必填：ppt | word | excel | web
  title: ""                  # 文件标题
  audience: ""               # 给谁看：领导 / 客户 / 团队 / 自己
  goal: ""                   # 这份文件要达成什么（一句话）
  outline:                   # 结构/大纲；不填则由助手按 goal 拟定
    - ""
  style: ""                  # 风格：商务严谨 / 活泼 / 极简 / 教程风
  length: ""                 # 体量：页数/字数/行数，如 "12 页" "800 字" "20 行"
  data_source: ""            # 数据从哪来：粘贴数据 / 引用文件 / 让我自己编示例
  constraints: ""            # 约束：配色、必须含某图、保密脱敏、品牌名等
  sample_file: ""            # 可选：附上的样例文件路径（用于试跑/对齐风格）

# ---- 各 output_type 的专属提示 ----
hints:
  ppt: "适合周报、方案汇报、产品介绍；outline 给到二级即可，助手补全每页要点。"
  word: "适合需求文档、说明书、邮件正文、制度稿；outline 用章节结构。"
  excel: "适合数据表、台账、清单；请在 data_source 给字段与示例行，或让助手起表头。"
  web: "适合落地页、说明页、小工具页；说明交互与内容区块即可，产出单页 HTML。"
