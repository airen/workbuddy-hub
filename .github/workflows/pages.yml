name: Deploy hub site to Pages

# 构建 registry/*.yaml → 静态站点并部署到 GitHub Pages。
# 站点地址：https://airen.github.io/workbuddy-hub/
#
# ⚠️ 首次启用需人工操作：仓库 Settings → Pages → Build and deployment →
#    Source 选择「GitHub Actions」。此步骤无法由 workflow 自动完成。
#
# 安全约定：
#   1. 默认权限最小化，仅 deploy job 提权（build job 只读，不持有 pages/id-token）。
#   2. 所有第三方 Action 固定到 commit SHA（tag 可被上游重指向），注释保留语义版本。
#   3. checkout 关闭凭据持久化，避免 token 落进 runner 的 git 配置。
#   4. 依赖锁定精确版本（见 scripts/requirements.txt）。
# SHA 于 2026-10-15 解析自各 action 的版本 tag。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 同一时间只允许一个 Pages 部署；不取消进行中的部署，避免站点处于半发布状态
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --disable-pip-version-check -r scripts/requirements.txt

      # 纵深防御：site/ 已被 gitignore，正常情况下 checkout 后并不存在；
      # 但仍先清空，确保上传的 artifact 只含本次生成的文件（避免误提交的残留文件被发布）。
      - name: Clean output dir
        run: rm -rf site

      - name: Build site
        run: python scripts/build_site.py

      # 发布门禁：体积、路径、幂等、筛选交互、控制台错误任一不过则阻断部署
      - name: Verify site
        run: python tests/verify_site.py --browser

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
